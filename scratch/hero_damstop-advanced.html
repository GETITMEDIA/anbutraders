<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #020408;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Deep Black & Midnight Navy Luxury Studio Background */
  .studio-bg {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    background:
      radial-gradient(1300px 850px at 50% 32%, #08172e 0%, #040d1c 45%, #01040a 100%),
      linear-gradient(180deg, #010307 0%, #030a16 55%, #010307 100%);
    z-index: 1;
  }

  /* Product-Specific Ambient Aura Behind the Can */
  .product-aura {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 980px;
    height: 680px;
    background: radial-gradient(circle at 50% 48%, rgba(6, 182, 212, 0.36) 0%, rgba(56, 189, 248, 0.24) 32%, rgba(224, 242, 254, 0.12) 60%, transparent 80%);
    filter: blur(24px);
    z-index: 2;
    pointer-events: none;
  }

  /* Top-Center Soft Spotlight Overhead Cone */
  .spotlight-top-center {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 780px;
    height: 980px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.30) 0%, rgba(200, 230, 255, 0.12) 35%, transparent 70%);
    clip-path: polygon(36% 0%, 64% 0%, 78% 100%, 22% 100%);
    filter: blur(22px);
    mix-blend-mode: screen;
    z-index: 3;
    pointer-events: none;
  }

  /* Top-Right Strong Diagonal Volumetric Spotlight Beam */
  .spotlight-top-right {
    position: absolute;
    top: -120px;
    right: 20px;
    width: 950px;
    height: 1150px;
    background: linear-gradient(215deg, rgba(255, 255, 255, 0.45) 0%, rgba(220, 240, 255, 0.28) 22%, rgba(186, 230, 253, 0.50) 45%, rgba(150, 200, 255, 0.08) 65%, transparent 80%);
    clip-path: polygon(68% 0%, 98% 0%, 55% 100%, 0% 100%);
    filter: blur(14px);
    mix-blend-mode: screen;
    opacity: 0.95;
    z-index: 4;
    pointer-events: none;
  }

  /* Secondary Diagonal Ray for Volumetric Depth */
  .spotlight-ray-secondary {
    position: absolute;
    top: -60px;
    right: 180px;
    width: 600px;
    height: 1000px;
    background: linear-gradient(220deg, rgba(255, 255, 255, 0.25) 0%, rgba(180, 220, 255, 0.15) 35%, transparent 70%);
    clip-path: polygon(50% 0%, 80% 0%, 65% 100%, 25% 100%);
    filter: blur(16px);
    mix-blend-mode: screen;
    z-index: 4;
    pointer-events: none;
  }

  /* Subtle Cool-Blue Side Rays on Left */
  .blue-side-rays {
    position: absolute;
    top: 60px;
    left: -40px;
    width: 700px;
    height: 750px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(96, 165, 250, 0.08) 40%, transparent 70%);
    clip-path: polygon(0% 20%, 60% 0%, 100% 80%, 20% 100%);
    filter: blur(28px);
    mix-blend-mode: screen;
    z-index: 3;
    pointer-events: none;
  }

  /* Soft Atmospheric Haze Across Midground */
  .atmospheric-haze {
    position: absolute;
    top: 420px;
    left: 50%;
    transform: translateX(-50%);
    width: 1700px;
    height: 400px;
    background: radial-gradient(ellipse at center, rgba(147, 197, 253, 0.08) 0%, rgba(56, 189, 248, 0.04) 40%, transparent 70%);
    filter: blur(35px);
    z-index: 5;
    pointer-events: none;
  }

  /* Floating Dust / Light Motes */
  .light-motes {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 1050px 320px, rgba(255,255,255,0.7), transparent),
      radial-gradient(2px 2px at 1180px 240px, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 1120px 450px, rgba(200,230,255,0.6), transparent),
      radial-gradient(2px 2px at 980px 280px, rgba(255,255,255,0.75), transparent),
      radial-gradient(1.5px 1.5px at 1240px 380px, rgba(255,240,200,0.6), transparent),
      radial-gradient(2px 2px at 890px 360px, rgba(255,255,255,0.65), transparent);
    z-index: 6;
    pointer-events: none;
    opacity: 0.85;
  }

  /* Dark Glossy Studio Floor */
  .glossy-floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 385px;
    background: linear-gradient(180deg, #030814 0%, #050d1e 35%, #02050e 70%, #010308 100%);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 7;
  }

  /* Horizon Gradient Fog */
  .horizon-fog {
    position: absolute;
    bottom: 350px;
    left: 0;
    right: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent 0%, rgba(5, 14, 30, 0.6) 60%, rgba(3, 8, 20, 0.95) 100%);
    z-index: 7;
    pointer-events: none;
  }

  /* Floor Spotlight Pool Below Bucket */
  .floor-spotlight-pool {
    position: absolute;
    bottom: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 820px;
    height: 160px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.30) 0%, rgba(6, 182, 212, 0.38) 30%, rgba(56, 189, 248, 0.24) 55%, transparent 75%);
    border-radius: 50%;
    filter: blur(16px);
    z-index: 8;
    pointer-events: none;
  }

  /* Realistic Dark Floor Contact Shadow */
  .floor-contact-shadow-deep {
    position: absolute;
    bottom: 366px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 32px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.98) 0%, rgba(0, 0, 0, 0.85) 45%, transparent 75%);
    border-radius: 50%;
    filter: blur(5px);
    z-index: 9;
    pointer-events: none;
  }

  .floor-contact-shadow-ambient {
    position: absolute;
    bottom: 350px;
    left: 50%;
    transform: translateX(-50%);
    width: 640px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.40) 50%, transparent 80%);
    border-radius: 50%;
    filter: blur(14px);
    z-index: 9;
    pointer-events: none;
  }

  /* Blurred Glossy Floor Reflection */
  .floor-reflection {
    position: absolute;
    bottom: 0px;
    left: 50%;
    transform: translateX(-50%) scaleY(-1);
    height: 520px;
    width: auto;
    object-fit: contain;
    z-index: 8;
    opacity: 0.32;
    filter: blur(2.5px);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.40) 30%, rgba(0,0,0,0.08) 60%, transparent 80%);
    mask-image: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.40) 30%, rgba(0,0,0,0.08) 60%, transparent 80%);
    pointer-events: none;
  }

  /* Main Paint Bucket (Centered & Unchanged) */
  .product-bucket {
    position: absolute;
    top: 178px;
    left: 50%;
    transform: translateX(-50%);
    height: 520px;
    width: auto;
    object-fit: contain;
    z-index: 10;
    filter: drop-shadow(0 24px 38px rgba(0, 0, 0, 0.90)) brightness(1.05) contrast(1.04);
  }

  /* High-End Studio Rim Light Edge Glow */
  .bucket-rim-lighting {
    position: absolute;
    top: 178px;
    left: 50%;
    transform: translateX(-50%);
    height: 520px;
    width: auto;
    pointer-events: none;
    z-index: 11;
    mix-blend-mode: screen;
    opacity: 0.45;
    filter: drop-shadow(-2px -2px 10px rgba(255, 255, 255, 0.6)) drop-shadow(3px -2px 14px rgba(186, 230, 253, 0.50));
  }

  /* Cinematic Vignette Border Frame */
  .vignette-frame {
    position: absolute;
    inset: 0;
    background: radial-gradient(1400px 900px at 50% 50%, transparent 58%, rgba(1, 3, 7, 0.60) 82%, #010205 100%);
    z-index: 12;
    pointer-events: none;
  }
</style>
</head>
<body>
  <!-- Studio Deep Dark Navy Background -->
  <div class="studio-bg"></div>

  <!-- Product Glow Aura -->
  <div class="product-aura"></div>

  <!-- Volumetric Spotlight Beams -->
  <div class="spotlight-top-center"></div>
  <div class="spotlight-top-right"></div>
  <div class="spotlight-ray-secondary"></div>
  <div class="blue-side-rays"></div>
  <div class="atmospheric-haze"></div>
  <div class="light-motes"></div>

  <!-- Glossy Studio Floor -->
  <div class="glossy-floor"></div>
  <div class="horizon-fog"></div>
  <div class="floor-spotlight-pool"></div>
  <div class="floor-contact-shadow-ambient"></div>
  <div class="floor-contact-shadow-deep"></div>

  <!-- Realistic Blurred Floor Reflection -->
  <img src="file:///d:/office_project_siva/anbutraders/anbu-paint/paint/berger-damstop-advanced.png" class="floor-reflection" alt="">

  <!-- The Exact Main Berger Product Bucket (100% Original Label & Logo) -->
  <img src="file:///d:/office_project_siva/anbutraders/anbu-paint/paint/berger-damstop-advanced.png" class="product-bucket" alt="Berger Damstop Advanced">

  <!-- Studio Rim Lighting Reflection Overlay -->
  <img src="file:///d:/office_project_siva/anbutraders/anbu-paint/paint/berger-damstop-advanced.png" class="bucket-rim-lighting" alt="">

  <!-- Luxury Cinematic Vignette -->
  <div class="vignette-frame"></div>
</body>
</html>
